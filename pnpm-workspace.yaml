allowBuilds:
  esbuild: true

overrides:
  d3-color: ">=3.1.0"
  prismjs: ">=1.30.0"
  uuid: ">=14.0.0"
  # Dev-tooling transitives (eslint, typescript-eslint, secretlint). Patched versions are
  # in-range for every consumer; scoped per major so minimatch 3 keeps brace-expansion 1.x.
  js-yaml: "^4.3.2"
  fast-uri: "^3.1.7"
  "brace-expansion@<2": ">=1.1.20 <2"
  "brace-expansion@>=5": "^5.0.11"

peerDependencyRules:
  allowedVersions:
    react: "19"
    react-dom: "19"
    "@types/react": "19"
    "@types/react-dom": "19"
